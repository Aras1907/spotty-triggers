[package]
name = "spotty-proton-account"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Proton account sign-in plus Proton Drive and Proton Calendar clients for Spotty (no web page, no helper process)"
license = "GPL-3.0-or-later"

[dependencies]
proton-srp = { version = "0.8.3", registry-index = "sparse+https://rust-registry.proton.me/index/" }
proton-crypto = { version = "0.14.0", default-features = false, features = ["rustpgp"], registry-index = "sparse+https://rust-registry.proton.me/index/" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
