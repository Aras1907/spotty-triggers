[package]
name = "spotty-proton-bridge-gui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Optional native Proton Mail Bridge login window for Spotty"

[features]
default = ["bundled-bridge"]
bundled-bridge = []

[dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
base64 = "0.22"
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_6"] }
glib = "0.20"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
native-tls = { version = "0.2", features = ["alpn"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-native-tls = "0.3"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
zeroize = "1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.dev]
debug = 0
