[package]
name = "spotty-proton-bridge-gui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Optional native Proton Mail Bridge login window for Spotty"

[features]
default = ["bundled-bridge"]
bundled-bridge = []

[dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
base64 = "0.22"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
zeroize = "1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.dev]
debug = 0
